<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2ea">
  <title>今日习惯 · Habit Flow</title>
  <style>
    :root {
      --ink: #111216;
      --muted: #71757d;
      --paper: #f4f5f2;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --line: rgba(17, 18, 22, 0.12);
      --pink: #f23893;
      --pink-dark: #d91f78;
      --cyan: #73e5e8;
      --cyan-dark: #1fc7cc;
      --lime: #c9ef35;
      --yellow: #ffe33e;
      --black: #101114;
      --shadow: 0 18px 50px rgba(17, 18, 22, 0.1);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--paper); }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 82% 5%, rgba(242, 56, 147, 0.14), transparent 24%),
        radial-gradient(circle at 8% 34%, rgba(201, 239, 53, 0.17), transparent 22%),
        radial-gradient(circle at 78% 83%, rgba(115, 229, 232, 0.19), transparent 28%),
        linear-gradient(135deg, #f8f9f7 0%, #eef1ee 52%, #f8f7f4 100%);
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image: radial-gradient(rgba(17, 18, 22, 0.22) 0.7px, transparent 0.7px);
      background-size: 8px 8px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 62%);
      mask-image: linear-gradient(to bottom, #000 0%, transparent 62%);
    }

    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      top: 31%;
      left: -9%;
      width: 52%;
      height: 12px;
      pointer-events: none;
      background: linear-gradient(90deg, var(--pink), #ff76b8 40%, var(--yellow) 68%, var(--cyan));
      box-shadow: 0 0 34px rgba(242, 56, 147, 0.22);
      transform: rotate(-8deg);
      opacity: 0.72;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(31, 199, 204, 0.42);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(800px, calc(100% - 32px));
      margin: 0 auto;
      padding: 52px 0 64px;
    }

    .app::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 112px;
      right: -82px;
      width: 174px;
      height: 174px;
      border: 2px solid rgba(242, 56, 147, 0.18);
      border-radius: 50%;
      box-shadow:
        0 0 0 24px rgba(115, 229, 232, 0.06),
        0 0 0 50px rgba(201, 239, 53, 0.045);
    }

    .header {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      padding: 0 6px;
    }

    .header::after {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 8px;
      width: 76px;
      height: 28px;
      background:
        linear-gradient(90deg, var(--cyan) 0 24%, transparent 24% 34%, var(--pink) 34% 58%, transparent 58% 68%, var(--lime) 68% 100%);
      clip-path: polygon(0 38%, 100% 0, 92% 100%, 8% 76%);
      opacity: 0.78;
      transform: rotate(-5deg);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 5px 10px 5px 8px;
      border: 1px solid rgba(17, 18, 22, 0.14);
      border-radius: 999px;
      color: var(--ink);
      font-family: "Arial Narrow", "Bahnschrift Condensed", sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.19em;
      line-height: 1;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 4px 12px rgba(17, 18, 22, 0.05);
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 12px 0 0 var(--cyan), 24px 0 0 var(--lime);
      margin-right: 24px;
    }

    h1 {
      position: relative;
      max-width: 620px;
      margin: 0;
      color: var(--ink);
      font-family: "Arial Black", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 950;
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    h1::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: -5px;
      bottom: 1px;
      width: min(228px, 58%);
      height: 13px;
      background: linear-gradient(90deg, rgba(115, 229, 232, 0.7), rgba(201, 239, 53, 0.52));
      transform: skewX(-13deg);
      transform-origin: left;
    }

    .date {
      display: inline-block;
      margin: 10px 0 0;
      padding-bottom: 3px;
      border-bottom: 3px solid var(--pink);
      color: #3f4248;
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    .summary {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
      padding: 29px 31px;
      border: 2px solid var(--cyan);
      border-radius: 28px;
      color: #ffffff;
      background-color: var(--black);
      background-image:
        radial-gradient(circle at 91% 8%, rgba(242, 56, 147, 0.26), transparent 27%),
        linear-gradient(112deg, rgba(115, 229, 232, 0.14), transparent 42%, rgba(242, 56, 147, 0.12));
      box-shadow:
        5px 5px 0 var(--pink),
        0 24px 54px rgba(17, 18, 22, 0.17);
    }

    .summary::after {
      content: "";
      position: absolute;
      width: 202px;
      height: 202px;
      right: -70px;
      top: -112px;
      border: 2px solid rgba(115, 229, 232, 0.34);
      border-radius: 50%;
      box-shadow:
        0 0 0 24px rgba(242, 56, 147, 0.08),
        0 0 0 52px rgba(201, 239, 53, 0.05);
      transform: rotate(12deg);
    }

    .summary-copy { position: relative; z-index: 1; }

    .summary-label {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.16em;
    }

    .count-line {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin: 0;
      line-height: 1;
    }

    .count-number {
      color: #ffffff;
      font-family: "Arial Black", "Bahnschrift", sans-serif;
      font-size: clamp(48px, 9vw, 70px);
      font-weight: 950;
      letter-spacing: -0.065em;
      text-shadow: 3px 3px 0 rgba(242, 56, 147, 0.72);
    }

    .count-unit {
      color: var(--yellow);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .progress-ring {
      --progress: 0deg;
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--cyan) var(--progress), rgba(255, 255, 255, 0.14) 0deg);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 25px rgba(115, 229, 232, 0.24);
    }

    .progress-ring::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: inherit;
      background: var(--black);
      box-shadow: inset 0 0 0 1px rgba(115, 229, 232, 0.19);
    }

    .progress-ring::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 2px dashed rgba(242, 56, 147, 0.36);
      border-radius: 50%;
      animation: orbit 18s linear infinite;
    }

    .progress-ring span {
      position: relative;
      z-index: 1;
      color: #ffffff;
      font-family: "Bahnschrift", sans-serif;
      font-size: 15px;
      font-weight: 850;
    }

    @keyframes orbit { to { transform: rotate(360deg); } }

    .add-card, .list-card {
      position: relative;
      border: 1px solid rgba(17, 18, 22, 0.12);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .add-card {
      overflow: hidden;
      padding: 20px;
      margin-bottom: 18px;
    }

    .add-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--cyan) 0 35%, var(--pink) 35% 70%, var(--lime) 70% 100%);
      opacity: 0.92;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px auto;
      gap: 10px;
    }

    .input-wrap { position: relative; }

    .input-icon, .select-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      z-index: 1;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 17px;
    }

    input, select {
      width: 100%;
      height: 50px;
      border: 1.5px solid rgba(17, 18, 22, 0.14);
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input {
      padding: 0 16px 0 43px;
      font-size: 15px;
    }

    input::placeholder { color: #92969c; }

    input:focus, select:focus {
      border-color: var(--cyan-dark);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(31, 199, 204, 0.12);
    }

    .select-wrap { position: relative; }

    select {
      appearance: none;
      padding: 0 34px 0 43px;
      cursor: pointer;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }

    .add-button {
      position: relative;
      height: 50px;
      padding: 0 22px;
      border: 1.5px solid var(--black);
      border-radius: 14px;
      color: #ffffff;
      font-weight: 850;
      letter-spacing: 0.02em;
      cursor: pointer;
      background: var(--black);
      box-shadow:
        4px 4px 0 var(--cyan),
        0 9px 18px rgba(17, 18, 22, 0.17);
      transition: color .2s, background .2s, transform .2s, box-shadow .2s;
    }

    .add-button:hover {
      color: var(--black);
      background: var(--cyan);
      box-shadow:
        4px 4px 0 var(--pink),
        0 11px 22px rgba(31, 199, 204, 0.22);
      transform: translate(-1px, -1px);
    }

    .add-button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--pink); }

    .list-card {
      overflow: hidden;
      background: rgba(255, 255, 255, 0.93);
    }

    .list-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 23px 16px;
      border-bottom: 1px solid rgba(17, 18, 22, 0.08);
      background:
        linear-gradient(100deg, rgba(115, 229, 232, 0.18), rgba(255, 255, 255, 0.7) 43%, rgba(242, 56, 147, 0.09));
    }

    .list-title {
      position: relative;
      margin: 0;
      font-family: "Arial Black", "Microsoft YaHei UI", sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .list-title::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 9px 2px 0;
      border-radius: 2px;
      background: var(--pink);
      box-shadow: 12px 0 0 var(--cyan), 24px 0 0 var(--lime);
      transform: translateY(-1px);
    }

    .habit-total {
      padding: 6px 11px;
      border-radius: 999px;
      color: #ffffff;
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.02em;
      background: var(--black);
      box-shadow: 3px 3px 0 rgba(115, 229, 232, 0.75);
    }

    .habits {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .habit {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      min-height: 76px;
      padding: 13px 12px 13px 14px;
      border: 1px solid rgba(17, 18, 22, 0.09);
      border-radius: 19px;
      background: rgba(247, 248, 246, 0.94);
      transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
      animation: enter .35s ease both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .habit:hover {
      border-color: rgba(31, 199, 204, 0.56);
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(17, 18, 22, 0.07);
      transform: translateY(-1px);
    }

    .habit.completed {
      border-color: var(--black);
      color: #ffffff;
      background:
        radial-gradient(circle at 96% 20%, rgba(242, 56, 147, 0.27), transparent 29%),
        linear-gradient(100deg, rgba(115, 229, 232, 0.16), transparent 58%),
        var(--black);
      box-shadow:
        0 5px 0 rgba(115, 229, 232, 0.64),
        0 12px 25px rgba(17, 18, 22, 0.12);
    }

    .habit.completed::after {
      content: "";
      position: absolute;
      right: 84px;
      bottom: 11px;
      width: 92px;
      height: 3px;
      border-radius: 99px;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(115, 229, 232, 0.8);
    }

    .check-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 2px solid #bec2c8;
      border-radius: 50%;
      color: transparent;
      font-family: "Arial Black", sans-serif;
      font-size: 21px;
      cursor: pointer;
      background: #ffffff;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.74);
      transition: border-color .2s, background .2s, color .2s, transform .16s, box-shadow .2s;
    }

    .check-button:hover {
      border-color: var(--pink);
      color: var(--pink);
      transform: scale(1.05);
      box-shadow: 0 0 0 5px rgba(242, 56, 147, 0.09);
    }

    .completed .check-button {
      border-color: var(--cyan);
      color: var(--black);
      background: var(--cyan);
      box-shadow:
        0 0 0 4px rgba(115, 229, 232, 0.17),
        0 0 20px rgba(115, 229, 232, 0.42);
    }

    .habit-copy { min-width: 0; }

    .habit-name {
      overflow: hidden;
      margin: 0;
      font-size: 16px;
      font-weight: 780;
      letter-spacing: -0.012em;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .2s;
    }

    .completed .habit-name {
      color: #ffffff;
      text-decoration: line-through;
      text-decoration-color: rgba(115, 229, 232, 0.66);
      text-decoration-thickness: 2px;
    }

    .habit-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 12px;
      font-weight: 600;
    }

    .completed .habit-status { color: var(--cyan); }

    .delete-button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 11px;
      color: #9a9ea5;
      font-size: 21px;
      line-height: 1;
      cursor: pointer;
      background: transparent;
      opacity: 0;
      transition: color .2s, background .2s, opacity .2s;
    }

    .habit:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: var(--pink); background: rgba(242, 56, 147, 0.1); }
    .completed .delete-button { color: rgba(255, 255, 255, 0.62); }
    .completed .delete-button:hover { color: var(--yellow); background: rgba(255, 255, 255, 0.1); }

    .empty {
      padding: 44px 20px 50px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon { display: block; margin-bottom: 12px; font-size: 38px; }
    .empty p { margin: 0; font-size: 14px; }

    .footer {
      margin: 18px 6px 0;
      color: #5f636a;
      font-family: "Bahnschrift", "Microsoft YaHei UI", sans-serif;
      font-size: 11px;
      font-weight: 580;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 620px) {
      body::after { left: -24%; width: 67%; top: 27%; }
      .app { width: min(100% - 22px, 800px); padding: 30px 0 44px; }
      .app::before { right: -102px; top: 100px; }
      .header { align-items: flex-start; margin-bottom: 18px; }
      .header::after { display: none; }
      h1 { font-size: clamp(36px, 11vw, 50px); }
      .summary { padding: 25px 22px; }
      .progress-ring { width: 78px; height: 78px; }
      .add-card { padding: 15px; }
      .add-form { grid-template-columns: minmax(0, 1fr) 78px; }
      .add-button { grid-column: 1 / -1; }
      .delete-button { opacity: 1; }
      .habit.completed::after { right: 72px; width: 68px; }
    }

    @media (max-width: 390px) {
      .summary { gap: 12px; }
      .count-number { font-size: 46px; }
      .progress-ring { width: 68px; height: 68px; }
      .habit { gap: 11px; }
      .check-button { width: 40px; height: 40px; }
      .habit.completed::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">Habit Flow</p>
        <h1>今天，也要坚持</h1>
        <p class="date" id="dateLabel"></p>
      </div>
    </header>

    <section class="summary" aria-labelledby="summaryLabel">
      <div class="summary-copy">
        <p class="summary-label" id="summaryLabel">今日完成</p>
        <p class="count-line">
          <span class="count-number" id="completedCount">0</span>
          <span class="count-unit">项</span>
        </p>
      </div>
      <div class="progress-ring" id="progressRing" aria-label="今日完成进度">
        <span id="progressText">0%</span>
      </div>
    </section>

    <section class="add-card" aria-label="添加习惯">
      <form class="add-form" id="addForm">
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">✨</span>
          <label class="sr-only" for="habitInput">习惯名称</label>
          <input id="habitInput" type="text" maxlength="24" autocomplete="off" placeholder="添加一个新习惯，例如：喝水" required>
        </div>
        <div class="select-wrap">
          <span class="select-icon" id="selectedIcon" aria-hidden="true">💧</span>
          <label class="sr-only" for="iconSelect">选择图标</label>
          <select id="iconSelect" aria-label="选择图标">
            <option value="💧">喝水</option>
            <option value="🏃">运动</option>
            <option value="📖">阅读</option>
            <option value="🧘">冥想</option>
            <option value="🌙">睡眠</option>
            <option value="✍️">学习</option>
            <option value="🌱">成长</option>
            <option value="⭐">其他</option>
          </select>
        </div>
        <button class="add-button" type="submit">添加习惯</button>
      </form>
    </section>

    <section class="list-card" aria-labelledby="listTitle">
      <div class="list-header">
        <h2 class="list-title" id="listTitle">我的习惯</h2>
        <span class="habit-total" id="habitTotal"></span>
      </div>
      <div class="habits" id="habitList"></div>
    </section>

    <p class="footer">进度会自动保存在当前浏览器中 · 每天自动重新开始</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "habit-flow-v1";
      const DEFAULT_HABITS = [
        { id: createId(), name: "喝够 8 杯水", icon: "💧", completions: {} },
        { id: createId(), name: "运动 30 分钟", icon: "🏃", completions: {} },
        { id: createId(), name: "阅读 20 分钟", icon: "📖", completions: {} }
      ];

      const elements = {
        addForm: document.getElementById("addForm"),
        habitInput: document.getElementById("habitInput"),
        iconSelect: document.getElementById("iconSelect"),
        selectedIcon: document.getElementById("selectedIcon"),
        habitList: document.getElementById("habitList"),
        completedCount: document.getElementById("completedCount"),
        progressRing: document.getElementById("progressRing"),
        progressText: document.getElementById("progressText"),
        habitTotal: document.getElementById("habitTotal"),
        dateLabel: document.getElementById("dateLabel")
      };

      let habits = loadHabits();
      let activeDate = getDateKey();
      let lastRenderedDate = "";

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function getDateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function loadHabits() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return DEFAULT_HABITS;
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) ? parsed : DEFAULT_HABITS;
        } catch (error) {
          console.warn("无法读取本地习惯数据：", error);
          return DEFAULT_HABITS;
        }
      }

      function saveHabits() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
        } catch (error) {
          console.warn("无法保存本地习惯数据：", error);
        }
      }

      function isCompletedToday(habit) {
        return Boolean(habit.completions && habit.completions[activeDate]);
      }

      function renderDate() {
        const now = new Date();
        const dateText = new Intl.DateTimeFormat("zh-CN", {
          month: "long",
          day: "numeric",
          weekday: "long"
        }).format(now);
        elements.dateLabel.textContent = dateText;
      }

      function render() {
        renderDate();
        elements.habitList.replaceChildren();

        const completed = habits.filter(isCompletedToday).length;
        const total = habits.length;
        const percentage = total ? Math.round((completed / total) * 100) : 0;

        elements.completedCount.textContent = completed;
        elements.progressText.textContent = `${percentage}%`;
        elements.progressRing.style.setProperty("--progress", `${percentage * 3.6}deg`);
        elements.progressRing.setAttribute("aria-label", `今日完成进度 ${percentage}%`);
        elements.habitTotal.textContent = total ? `已完成 ${completed} / ${total}` : "";

        if (!habits.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.textContent = "🌿";
          const text = document.createElement("p");
          text.textContent = "还没有习惯，从上方添加第一个吧。";
          empty.append(icon, text);
          elements.habitList.append(empty);
        } else {
          habits.forEach((habit, index) => {
            elements.habitList.append(createHabitElement(habit, index));
          });
        }

        lastRenderedDate = activeDate;
      }

      function createHabitElement(habit, index) {
        const completed = isCompletedToday(habit);
        const item = document.createElement("article");
        item.className = `habit${completed ? " completed" : ""}`;
        item.style.animationDelay = `${Math.min(index * 35, 210)}ms`;

        const checkButton = document.createElement("button");
        checkButton.type = "button";
        checkButton.className = "check-button";
        checkButton.textContent = completed ? "✓" : "";
        checkButton.setAttribute("aria-label", completed ? `取消完成：${habit.name}` : `标记完成：${habit.name}`);
        checkButton.setAttribute("aria-pressed", String(completed));
        checkButton.addEventListener("click", () => toggleHabit(habit.id));

        const copy = document.createElement("div");
        copy.className = "habit-copy";
        const name = document.createElement("p");
        name.className = "habit-name";
        name.textContent = `${habit.icon || "⭐"}  ${habit.name}`;
        const status = document.createElement("p");
        status.className = "habit-status";
        status.textContent = completed ? "今天已完成" : "等待今日打卡";
        copy.append(name, status);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `删除习惯：${habit.name}`);
        deleteButton.title = "删除";
        deleteButton.addEventListener("click", () => deleteHabit(habit.id));

        item.append(checkButton, copy, deleteButton);
        return item;
      }

      function toggleHabit(id) {
        habits = habits.map((habit) => {
          if (habit.id !== id) return habit;
          const completions = { ...(habit.completions || {}) };
          if (completions[activeDate]) {
            delete completions[activeDate];
          } else {
            completions[activeDate] = true;
          }
          return { ...habit, completions };
        });
        saveHabits();
        render();
      }

      function deleteHabit(id) {
        const habit = habits.find((item) => item.id === id);
        if (!habit) return;
        if (!window.confirm(`确定删除“${habit.name}”吗？历史记录也会一起删除。`)) return;
        habits = habits.filter((item) => item.id !== id);
        saveHabits();
        render();
      }

      function addHabit(event) {
        event.preventDefault();
        const name = elements.habitInput.value.trim().replace(/\s+/g, " ");
        if (!name) return;

        habits.push({
          id: createId(),
          name,
          icon: elements.iconSelect.value,
          completions: {}
        });
        saveHabits();
        elements.habitInput.value = "";
        elements.habitInput.focus();
        render();
      }

      function checkDateChange() {
        const nextDate = getDateKey();
        if (nextDate !== activeDate) {
          activeDate = nextDate;
          render();
        }
      }

      elements.addForm.addEventListener("submit", addHabit);
      elements.iconSelect.addEventListener("change", () => {
        elements.selectedIcon.textContent = elements.iconSelect.value;
      });

      saveHabits();
      render();
      window.setInterval(checkDateChange, 60 * 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkDateChange();
      });
    })();
  </script>
</body>
</html>
